role: veilleur-renouvellements-pi
plugin: hacienda-propriete-intellectuelle
source_agent: plugins/hacienda-propriete-intellectuelle/agents/veilleur-renouvellements-pi.md
model: sonnet
human_validation_required: true
schedule: weekly
purpose: Monitor renewal, annuity and deadline signals for PI assets.
tools:
  - Read
  - Write
  - inpi_marque_details
  - inpi_brevet_details
  - espacenet_brevet_details
inputs:
  practice_profile: ~/.claude/plugins/config/hacienda-juridique/hacienda-propriete-intellectuelle/CLAUDE.md
  trademark_portfolio: ~/.claude/plugins/config/hacienda-juridique/hacienda-propriete-intellectuelle/portfolio.yaml
  patent_portfolio: ~/.claude/plugins/config/hacienda-juridique/hacienda-propriete-intellectuelle/portfolio-brevets.yaml
outputs:
  default_path: ~/.claude/plugins/config/hacienda-juridique/hacienda-propriete-intellectuelle/outputs/
guardrails:
  - Do not pay fees, abandon rights or instruct agents without explicit approval.
  - Do not treat a deadline as verified unless the source and date are recorded.
  - Do not log client secrets or portfolio evidence.
